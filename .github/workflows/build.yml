# Builds @ReCON (addons/ReCON.pbo, mod.cpp, LICENSE, NOTICE) and satmap
# (the map picture maker) on every push and pull request, and tests it all. Download it from the run's
# Artifacts. Pushing a tag such as v0.1.0 also publishes it as a release.
#
# Or run it by hand (Actions -> Build the mod -> Run workflow) with a tag
# and a commit: it builds that commit and publishes a pre-release with that
# tag on it, ReCON-Mod.zip attached. GitHub makes the tag.
name: Build the mod

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, such as v0.0.1-a978cde0"
        required: true
      commit:
        description: "The commit to build and tag (default: the branch run on)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test ./...
      - name: Pack @ReCON
        run: go run ./cmd/pbo
      - name: Zip
        run: zip -r ReCON-Mod.zip @ReCON
      - name: Build satmap
        # The map picture maker (cmd/satmap), ready to run.
        run: |
          for t in windows/amd64 linux/amd64 darwin/arm64 darwin/amd64; do
            os=${t%/*} arch=${t#*/} ext=; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "satmap-$os-$arch$ext" ./cmd/satmap
          done
      - uses: actions/upload-artifact@v4
        with:
          name: "@ReCON"
          path: "@ReCON"
      - name: Release
        # A tag pushed, or one made by publishing a release on GitHub: the zip
        # goes on that tag's release (made here if there isn't one yet).
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ReCON-Mod.zip satmap-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" ReCON-Mod.zip satmap-* --title "$GITHUB_REF_NAME" --verify-tag \
              --notes "The @ReCON mod folder. Monetized servers need Bohemia Interactive's approval, see NOTICE."
          fi
      - name: Release (run by hand)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v*) ;; *) echo "The tag must start with v"; exit 1 ;; esac
          gh release create "$TAG" ReCON-Mod.zip satmap-* --target "$(git rev-parse HEAD)" --prerelease --title "$TAG" \
            --notes "The @ReCON mod folder, built from $(git rev-parse --short=8 HEAD). Monetized servers need Bohemia Interactive's approval, see NOTICE."
