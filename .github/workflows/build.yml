# Builds @ReCON (addons/ReCON.pbo, mod.cpp, LICENSE, NOTICE) on every push
# and pull request, and tests the panel. Download it from the run's
# Artifacts. Pushing a tag such as v0.1.0 also publishes it as a release.
name: Build the mod

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test ./...
      - name: Pack @ReCON
        run: go run ./cmd/pbo
      - name: Zip
        run: zip -r ReCON-Mod.zip @ReCON
      - uses: actions/upload-artifact@v4
        with:
          name: "@ReCON"
          path: "@ReCON"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ReCON-Mod.zip --title "$GITHUB_REF_NAME" --verify-tag \
            --notes "The @ReCON mod folder. Not for monetized servers, see NOTICE."
